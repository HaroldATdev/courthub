<!DOCTYPE html>
<!-- Vista de error (404 / 403 / 500) · usada por Spring Boot (/error) y ViewExceptionHandler -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="font-sans bg-[#f6f7f7] text-slate-800 min-h-screen flex flex-col">
  <main class="flex-1 grid place-items-center px-4 py-16">
    <div class="card p-10 text-center max-w-md w-full fade-up">
      <span class="inline-grid place-items-center w-16 h-16 rounded-full bg-red-50 text-red-400 mb-4" data-icon="xCircle" data-cls="w-7 h-7"></span>
      <p class="ch-label-tiny" th:text="'Error ' + ${status}">Error</p>
      <h1 class="font-display text-2xl font-bold text-slate-900 mt-1" th:text="${status == 404 ? 'Página no encontrada' : (status == 403 ? 'Acceso denegado' : 'Algo salió mal')}"></h1>
      <p class="text-sm text-gray-500 mt-2" th:text="${mensaje != null ? mensaje : 'La página que buscas no existe o no está disponible.'}"></p>
      <div class="flex justify-center gap-3 mt-7">
        <a th:href="@{/}" class="btn-primary">Ir al inicio</a>
        <a th:href="@{/login}" class="btn-outline">Iniciar sesión</a>
      </div>
    </div>
  </main>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
