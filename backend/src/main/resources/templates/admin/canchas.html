<!DOCTYPE html>
<!-- Vista ERP: Catálogo de canchas · Controlador: AdminViewController#canchas / #estadoCancha -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin · Canchas')}"></head>
<body class="font-sans bg-[#f6f7f7] text-slate-800 min-h-screen flex flex-col">
  <header th:replace="~{fragments/layout :: header('admin')}"></header>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pb-10 pt-6">
    <div th:replace="~{admin/_layout :: cabecera('Catálogo de canchas', 'Alta, edición y activación de las sedes deportivas.')}"></div>

    <div class="grid lg:grid-cols-[220px_1fr] gap-6 mt-6 items-start">
      <nav th:replace="~{admin/_layout :: sidebar}"></nav>

      <section class="min-w-0 space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <p class="text-sm text-gray-500"><span th:text="${#lists.size(canchas)}"></span> canchas registradas · <span th:text="${#lists.size(canchas.?[activa])}"></span> activas</p>
          <a th:href="@{/admin/canchas/nueva}" class="btn-primary !py-2 !px-4 !text-[13px]">+ Nueva cancha</a>
        </div>
        <div class="card overflow-hidden"><div class="overflow-x-auto"><table class="admin-table">
          <thead><tr><th>Cancha</th><th>Deporte</th><th>Distrito</th><th>Precio/h</th><th>Calificación</th><th>Servicios</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
            <tr th:each="c : ${canchas}" th:classappend="${!c.activa} ? 'opacity-60'">
              <td><div class="flex items-center gap-3"><img th:src="${c.imagen}" th:data-fallback="'cancha' + ${c.id}" class="w-12 h-9 rounded-md object-cover bg-primary-50" alt=""><div><p class="font-semibold text-slate-800" th:text="${c.nombre}"></p><p class="text-xs text-gray-400" th:text="${c.subtipo}"></p></div></div></td>
              <td th:text="${@fmt.deporte(c.tipo)}"></td>
              <td th:text="${c.comuna}"></td>
              <td class="font-semibold" th:text="${@fmt.pen(c.precioHora)}"></td>
              <td><span class="text-amber-400 inline-block align-middle" data-icon="star" data-cls="w-3.5 h-3.5"></span> <span th:text="${@fmt.dec1(c.calificacion)}"></span> <span class="text-xs text-gray-400" th:text="'(' + ${c.opiniones} + ')'"></span></td>
              <td class="text-xs text-gray-500" th:text="${#lists.size(c.servicios)} + ' servicios'"></td>
              <td><span th:replace="~{admin/_layout :: activo(${c.activa}, 'Activa', 'Inactiva')}"></span></td>
              <td><div class="flex gap-1.5">
                <a th:href="@{/admin/canchas/{id}/editar(id=${c.id})}" class="btn-outline !py-1 !px-2.5 !text-xs">Editar</a>
                <form th:action="@{/admin/canchas/{id}/estado(id=${c.id})}" method="post"><button type="submit" class="!py-1 !px-2.5 !text-xs" th:classappend="${c.activa} ? 'btn-danger' : 'btn-outline'" th:text="${c.activa} ? 'Desactivar' : 'Activar'"></button></form>
              </div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(canchas)}"><td colspan="8" class="text-center text-gray-400 py-10">No hay canchas registradas.</td></tr>
          </tbody>
        </table></div></div>
      </section>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
