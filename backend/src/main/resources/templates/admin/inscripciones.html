<!DOCTYPE html>
<!-- Vista ERP: Inscripciones a clases · Controlador: AdminViewController#inscripciones / #estadoInscripcion -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin · Inscripciones')}"></head>
<body class="font-sans bg-[#f6f7f7] text-slate-800 min-h-screen flex flex-col">
  <header th:replace="~{fragments/layout :: header('admin')}"></header>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pb-10 pt-6">
    <div th:replace="~{admin/_layout :: cabecera('Inscripciones a clases', 'Alumnos inscritos, asistencia y cancelaciones.')}"></div>

    <div class="grid lg:grid-cols-[220px_1fr] gap-6 mt-6 items-start">
      <nav th:replace="~{admin/_layout :: sidebar}"></nav>

      <section class="min-w-0 space-y-5">
        <form th:action="@{/admin/inscripciones}" method="get" class="card p-4 flex flex-wrap items-end gap-3">
          <div><p class="ch-label-tiny mb-1.5">Estado</p>
            <select name="estado" class="ch-select" data-autosubmit>
              <option value="">Todos</option>
              <option value="inscrito" th:selected="${estado == 'inscrito'}">Inscrito</option>
              <option value="asistio" th:selected="${estado == 'asistio'}">Asistió</option>
              <option value="cancelado" th:selected="${estado == 'cancelado'}">Cancelado</option>
            </select></div>
          <p class="text-sm text-gray-500 pb-2"><span th:text="${#lists.size(inscripciones)}"></span> inscripciones</p>
        </form>
        <div class="card overflow-hidden"><div class="overflow-x-auto"><table class="admin-table">
          <thead><tr><th>Alumno</th><th>Clase</th><th>Fecha de la clase</th><th>Inscrito el</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
            <tr th:each="i : ${inscripciones}">
              <td><p class="font-semibold text-slate-800" th:text="${i.alumno}"></p><p class="text-xs text-gray-400" th:text="${i.email}"></p></td>
              <td><span th:text="${i.clase}"></span><p class="text-xs text-gray-400" th:text="${@fmt.deporte(i.deporte)}"></p></td>
              <td th:text="${@fmt.fecha(i.fechaClase, 'dd MMM yyyy')}"></td>
              <td class="text-xs" th:text="${@fmt.fechaHora(i.fechaInscripcion)}"></td>
              <td><span class="badge" th:classappend="${i.estado == 'inscrito'} ? 'badge-confirmada' : (${i.estado == 'asistio'} ? 'badge-completada' : 'badge-cancelada')" th:text="${i.estado == 'asistio'} ? 'Asistió' : ${#strings.capitalize(i.estado)}"></span></td>
              <td><div class="flex gap-1.5">
                <form th:if="${i.estado == 'inscrito'}" th:action="@{/admin/inscripciones/{id}/estado(id=${i.id})}" method="post"><input type="hidden" name="filtro" th:value="${estado}"><button name="estado" value="asistio" class="btn-outline !py-1 !px-2.5 !text-xs">Marcar asistencia</button></form>
                <form th:if="${i.estado == 'inscrito'}" th:action="@{/admin/inscripciones/{id}/estado(id=${i.id})}" method="post"><input type="hidden" name="filtro" th:value="${estado}"><button name="estado" value="cancelado" class="btn-danger !py-1 !px-2.5 !text-xs">Cancelar</button></form>
                <form th:if="${i.estado != 'inscrito'}" th:action="@{/admin/inscripciones/{id}/estado(id=${i.id})}" method="post"><input type="hidden" name="filtro" th:value="${estado}"><button name="estado" value="inscrito" class="btn-outline !py-1 !px-2.5 !text-xs">Reinscribir</button></form>
              </div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(inscripciones)}"><td colspan="6" class="text-center text-gray-400 py-10">No hay inscripciones.</td></tr>
          </tbody>
        </table></div></div>
      </section>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
