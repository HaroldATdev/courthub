<!DOCTYPE html>
<!-- Vista ERP: Formulario de usuario (crear / editar) · th:object="${usuarioForm}" · Controlador: AdminViewController -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${usuarioId == null ? 'Nuevo usuario' : 'Editar usuario'})}"></head>
<body class="font-sans bg-[#f6f7f7] text-slate-800 min-h-screen flex flex-col">
  <header th:replace="~{fragments/layout :: header('admin')}"></header>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pb-10 pt-6">
    <div th:replace="~{admin/_layout :: cabecera(${usuarioId == null ? 'Nuevo usuario' : 'Editar usuario'}, 'Datos de la cuenta, rol y estado.')}"></div>

    <div class="grid lg:grid-cols-[220px_1fr] gap-6 mt-6 items-start">
      <nav th:replace="~{admin/_layout :: sidebar}"></nav>

      <section class="min-w-0">
        <form th:action="${usuarioId == null} ? @{/admin/usuarios} : @{/admin/usuarios/{id}(id=${usuarioId})}" th:object="${usuarioForm}" method="post" class="card p-6 sm:p-8 space-y-5" novalidate>
          <p th:if="${formError}" th:text="${formError}" class="text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></p>
          <p th:if="${#fields.hasErrors('*')}" class="text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3" th:errors="*{*}"></p>

          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="ch-label">Nombre</label><input type="text" th:field="*{nombre}" class="ch-input ch-input-plain"></div>
            <div><label class="ch-label">Apellido</label><input type="text" th:field="*{apellido}" class="ch-input ch-input-plain"></div>
            <div class="sm:col-span-2"><label class="ch-label">Correo electrónico</label><input type="email" th:field="*{email}" class="ch-input ch-input-plain"></div>
            <div class="sm:col-span-2"><label class="ch-label" th:text="${usuarioId == null} ? 'Contraseña' : 'Nueva contraseña (vacío = sin cambios)'"></label><input type="password" th:field="*{password}" class="ch-input ch-input-plain" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
            <div><label class="ch-label">Rol</label>
              <select th:field="*{rol}" class="ch-select !w-full !py-2.5">
                <option value="cliente">Cliente</option>
                <option value="entrenador">Entrenador</option>
                <option value="administrador">Administrador</option>
              </select></div>
            <div><label class="ch-label">Teléfono</label><input type="text" th:field="*{telefono}" class="ch-input ch-input-plain" placeholder="+51 9 ..."></div>
            <div><label class="ch-label">Nivel</label>
              <select th:field="*{nivel}" class="ch-select !w-full !py-2.5">
                <option th:each="n : ${ {'Bronce','Plata','Oro'} }" th:value="${n}" th:text="${n}"></option>
              </select></div>
            <div><label class="ch-label">Deporte favorito</label>
              <select th:field="*{deporteFavorito}" class="ch-select !w-full !py-2.5">
                <option value="Multi">Multi</option>
                <option th:each="d : ${deportes}" th:if="${d.key != 'todos'}" th:value="${d.value}" th:text="${d.value}"></option>
              </select></div>
            <label class="flex items-center gap-2.5 text-sm text-slate-700 cursor-pointer select-none"><input type="checkbox" th:field="*{activo}" class="w-4 h-4 rounded border-gray-300 accent-primary-500">Cuenta activa</label>
          </div>

          <div class="flex gap-3 pt-2">
            <a th:href="@{/admin/usuarios}" class="btn-outline flex-1 !py-2.5">Cancelar</a>
            <button type="submit" class="btn-primary flex-1 !py-2.5">Guardar</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
