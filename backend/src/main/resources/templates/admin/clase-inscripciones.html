<!DOCTYPE html>
<!-- Vista ERP: Inscritos de una clase · Controlador: AdminViewController#inscripcionesDeClase -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin · Inscritos')}"></head>
<body class="font-sans bg-[#f6f7f7] text-slate-800 min-h-screen flex flex-col">
  <header th:replace="~{fragments/layout :: header('admin')}"></header>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pb-10 pt-6">
    <div th:replace="~{admin/_layout :: cabecera('Inscritos · ' + ${clase.nombre}, ${@fmt.deporte(clase.deporte)} + ' · ' + ${@fmt.fecha(clase.fecha, 'EEEE d MMM yyyy')} + ' · ' + ${clase.horaInicio} + ' - ' + ${clase.horaFin} + ' · Coach ' + ${clase.entrenador.nombre})}"></div>

    <div class="grid lg:grid-cols-[220px_1fr] gap-6 mt-6 items-start">
      <nav th:replace="~{admin/_layout :: sidebar}"></nav>

      <section class="min-w-0 space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="w-64"><div th:replace="~{admin/_layout :: cupo(${clase.inscritos}, ${clase.cupoMax})}"></div></div>
          <a th:href="@{/admin/clases}" class="btn-outline !py-2"><span data-icon="arrowLeft" data-cls="w-4 h-4"></span>Volver a clases</a>
        </div>
        <div class="card overflow-hidden"><div class="overflow-x-auto"><table class="admin-table">
          <thead><tr><th>Alumno</th><th>Correo</th><th>Inscrito el</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
            <tr th:each="i : ${inscripciones}">
              <td class="font-semibold text-slate-800" th:text="${i.alumno}"></td>
              <td class="text-xs" th:text="${i.email}"></td>
              <td class="text-xs" th:text="${@fmt.fechaHora(i.fechaInscripcion)}"></td>
              <td><span class="badge" th:classappend="${i.estado == 'inscrito'} ? 'badge-confirmada' : (${i.estado == 'asistio'} ? 'badge-completada' : 'badge-cancelada')" th:text="${i.estado == 'asistio'} ? 'Asistió' : ${#strings.capitalize(i.estado)}"></span></td>
              <td><div class="flex gap-1.5">
                <form th:if="${i.estado == 'inscrito'}" th:action="@{/admin/inscripciones/{id}/estado(id=${i.id})}" method="post"><button name="estado" value="asistio" class="btn-outline !py-1 !px-2.5 !text-xs">Marcar asistencia</button></form>
                <form th:if="${i.estado == 'inscrito'}" th:action="@{/admin/inscripciones/{id}/estado(id=${i.id})}" method="post"><button name="estado" value="cancelado" class="btn-danger !py-1 !px-2.5 !text-xs">Cancelar</button></form>
                <form th:if="${i.estado != 'inscrito'}" th:action="@{/admin/inscripciones/{id}/estado(id=${i.id})}" method="post"><button name="estado" value="inscrito" class="btn-outline !py-1 !px-2.5 !text-xs">Reinscribir</button></form>
              </div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(inscripciones)}"><td colspan="5" class="text-center text-gray-400 py-10">Nadie se ha inscrito todavía.</td></tr>
          </tbody>
        </table></div></div>
      </section>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
