<!DOCTYPE html>
<!-- Vista ERP: Gestión de reservas · Controlador: AdminViewController#reservas / #estadoReserva / #exportarReservas -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin · Reservas')}"></head>
<body class="font-sans bg-[#f6f7f7] text-slate-800 min-h-screen flex flex-col">
  <header th:replace="~{fragments/layout :: header('admin')}"></header>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pb-10 pt-6">
    <div th:replace="~{admin/_layout :: cabecera('Gestión de reservas', 'Todas las reservas de la red: filtra, confirma, completa o cancela.')}"></div>

    <div class="grid lg:grid-cols-[220px_1fr] gap-6 mt-6 items-start">
      <nav th:replace="~{admin/_layout :: sidebar}"></nav>

      <section class="min-w-0 space-y-5">
        <!-- Filtros (GET) -->
        <form th:action="@{/admin/reservas}" method="get" class="card p-4 flex flex-wrap items-end gap-3">
          <div><p class="ch-label-tiny mb-1.5">Estado</p>
            <select name="estado" class="ch-select">
              <option value="">Todos</option>
              <option th:each="e : ${ {'pendiente','confirmada','completada','cancelada'} }" th:value="${e}" th:text="${#strings.capitalize(e)}" th:selected="${f.estado == e}"></option>
            </select></div>
          <div><p class="ch-label-tiny mb-1.5">Cancha</p>
            <select name="canchaId" class="ch-select">
              <option value="">Todas</option>
              <option th:each="c : ${canchas}" th:value="${c.id}" th:text="${c.nombre}" th:selected="${f.canchaId == #strings.toString(c.id)}"></option>
            </select></div>
          <div><p class="ch-label-tiny mb-1.5">Desde</p><input name="desde" type="date" class="ch-select" th:value="${f.desde}"></div>
          <div><p class="ch-label-tiny mb-1.5">Hasta</p><input name="hasta" type="date" class="ch-select" th:value="${f.hasta}"></div>
          <div class="flex-1 min-w-[180px]"><p class="ch-label-tiny mb-1.5">Buscar</p><input name="q" type="text" class="ch-select !w-full" placeholder="Código, cliente o correo" th:value="${f.q}"></div>
          <button type="submit" class="btn-primary !py-2 !px-4 !text-[13px]">Filtrar</button>
          <a th:href="@{/admin/reservas/exportar(estado=${f.estado}, desde=${f.desde}, hasta=${f.hasta}, canchaId=${f.canchaId}, q=${f.q})}" class="btn-outline !py-2">Exportar CSV</a>
        </form>

        <p class="text-sm text-gray-500"><span th:text="${#lists.size(reservas)}"></span> reserva(s) · Ingresos del filtro: <b class="text-slate-800" th:text="${@fmt.pen(totalFiltro)}"></b></p>

        <div class="card overflow-hidden"><div class="overflow-x-auto"><table class="admin-table">
          <thead><tr><th>Código</th><th>Cliente</th><th>Cancha</th><th>Fecha y hora</th><th>Subtotal</th><th>Cargo</th><th>Total</th><th>Pago</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
            <tr th:each="r : ${reservas}">
              <td class="font-mono text-xs" th:text="${r.codigo}"></td>
              <td><p class="font-semibold text-slate-800" th:text="${r.cliente != null ? r.cliente.nombre : '—'}"></p><p class="text-xs text-gray-400" th:text="${r.cliente != null ? r.cliente.email : ''}"></p></td>
              <td><p th:text="${r.cancha.nombre}"></p><p class="text-xs text-gray-400" th:text="${@fmt.deporte(r.cancha.tipo)} + ' · ' + ${r.cancha.comuna}"></p></td>
              <td><span th:text="${@fmt.fecha(r.fecha, 'dd MMM yyyy')}"></span><p class="text-xs text-gray-400" th:text="${r.horaInicio} + ' - ' + ${r.horaFin}"></p></td>
              <td th:text="${@fmt.pen(r.subtotal)}"></td>
              <td th:text="${@fmt.pen(r.cargoServicio)}"></td>
              <td class="font-semibold" th:text="${@fmt.pen(r.total)}"></td>
              <td class="text-xs" th:text="${r.metodoPago}"></td>
              <td><span th:replace="~{admin/_layout :: estado(${r.estado})}"></span></td>
              <td>
                <div class="flex gap-1.5">
                  <form th:if="${r.estado == 'pendiente'}" th:action="@{/admin/reservas/{id}/estado(id=${r.id})}" method="post"><input type="hidden" name="volver" th:value="${volver}"><button name="estado" value="confirmada" class="btn-outline !py-1 !px-2.5 !text-xs">Confirmar</button></form>
                  <form th:if="${r.estado == 'pendiente' or r.estado == 'confirmada'}" th:action="@{/admin/reservas/{id}/estado(id=${r.id})}" method="post"><input type="hidden" name="volver" th:value="${volver}"><button name="estado" value="completada" class="btn-outline !py-1 !px-2.5 !text-xs">Completar</button></form>
                  <form th:if="${r.estado == 'pendiente' or r.estado == 'confirmada'}" th:action="@{/admin/reservas/{id}/estado(id=${r.id})}" method="post" data-confirm="¿Cancelar la reserva? El bloque quedará libre."><input type="hidden" name="volver" th:value="${volver}"><button name="estado" value="cancelada" class="btn-danger !py-1 !px-2.5 !text-xs">Cancelar</button></form>
                  <form th:if="${r.estado == 'cancelada'}" th:action="@{/admin/reservas/{id}/estado(id=${r.id})}" method="post"><input type="hidden" name="volver" th:value="${volver}"><button name="estado" value="confirmada" class="btn-outline !py-1 !px-2.5 !text-xs">Reactivar</button></form>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reservas)}"><td colspan="10" class="text-center text-gray-400 py-10">No hay reservas con esos filtros.</td></tr>
          </tbody>
        </table></div></div>
      </section>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
