<!DOCTYPE html>
<!-- ============================================================
     CourtHub · fragments/layout.html — Fragmentos comunes (View)
     head(titulo) · header(activo) · footer · scripts
     ============================================================ -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="'CourtHub — ' + ${titulo}">CourtHub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2310b981'/%3E%3Crect x='4.5' y='6.5' width='15' height='11' rx='2' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cline x1='12' y1='6.5' x2='12' y2='17.5' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { primary: {50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b'} },
      fontFamily: { display: ['Poppins','ui-sans-serif','system-ui','sans-serif'], sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] }
    } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <script th:src="@{/js/icons.js}"></script>
</head>
<body>

<!-- ============ Header con navegación, buscador y menú de perfil ============ -->
<header th:fragment="header(activo)" class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-100">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-3 sm:gap-4">
    <a th:href="@{/dashboard}" class="flex items-center gap-2.5 shrink-0">
      <span class="w-9 h-9 rounded-[10px] bg-primary-500 grid place-items-center text-white shadow-[0_4px_12px_-4px_rgba(16,185,129,.7)]" data-icon="logo" data-cls="w-[18px] h-[18px]"></span>
      <span class="font-display font-bold text-[21px] tracking-tight text-slate-900">CourtHub</span>
    </a>
    <form th:action="@{/dashboard}" method="get" class="hidden md:flex flex-1 justify-center px-2 lg:px-8">
      <div class="relative w-full max-w-md">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" data-icon="search" data-cls="w-[17px] h-[17px]"></span>
        <input name="q" th:value="${q}" placeholder="Buscar canchas, clubes o deportes..." autocomplete="off"
               class="w-full h-11 rounded-full bg-gray-100/90 border border-transparent focus:border-primary-300 focus:bg-white pl-11 pr-4 text-sm outline-none transition placeholder:text-gray-400">
      </div>
    </form>
    <nav class="hidden lg:flex items-center gap-6 text-sm ml-auto">
      <a th:href="@{/dashboard}" class="transition" th:classappend="${activo == 'canchas'} ? 'text-primary-600 font-semibold' : 'text-slate-500 hover:text-slate-800'">Canchas</a>
      <a th:href="@{/clases}" class="transition" th:classappend="${activo == 'clases'} ? 'text-primary-600 font-semibold' : 'text-slate-500 hover:text-slate-800'">Clases</a>
      <a th:href="@{/mis-reservas}" class="transition" th:classappend="${activo == 'reservas'} ? 'text-primary-600 font-semibold' : 'text-slate-500 hover:text-slate-800'">Mis Reservas</a>
      <a th:if="${esAdmin}" th:href="@{/admin}" class="transition" th:classappend="${activo == 'admin'} ? 'text-primary-600 font-semibold' : 'text-slate-500 hover:text-slate-800'">Administración</a>
    </nav>
    <button id="ch-bell" type="button" title="Notificaciones" class="relative w-10 h-10 rounded-full grid place-items-center text-slate-500 hover:bg-gray-100 transition shrink-0">
      <span data-icon="bell" data-cls="w-5 h-5"></span>
      <span class="absolute top-2 right-2.5 w-2 h-2 rounded-full bg-primary-500 ring-2 ring-white"></span>
    </button>
    <span class="hidden sm:block w-px h-6 bg-gray-200 shrink-0"></span>
    <div class="relative shrink-0" th:with="u=${usuario}">
      <button id="ch-profile-btn" type="button" class="flex items-center gap-2.5 rounded-full hover:bg-gray-50 pl-0.5 pr-1.5 py-1 transition">
        <span class="w-9 h-9 rounded-full bg-primary-100 text-primary-700 grid place-items-center text-xs font-bold" th:text="${u != null ? u.iniciales() : 'U'}">GD</span>
        <span class="hidden sm:block text-left leading-tight">
          <span class="block text-sm font-semibold text-slate-800" th:text="${u != null ? u.nombreCompleto() : 'Invitado'}">Gustavo Diaz</span>
          <span class="block text-[11px] text-primary-600 font-medium" th:text="'Nivel ' + ${u != null ? u.nivel : 'Bronce'} + ' • ' + ${u != null ? u.deporte : 'Multi'}">Nivel Oro • Pádel</span>
        </span>
      </button>
      <div id="ch-profile-menu" class="hidden absolute right-0 mt-2 w-60 bg-white border border-gray-100 rounded-2xl shadow-xl p-2 z-50">
        <div class="px-3 py-2 border-b border-gray-50 mb-1">
          <p class="text-sm font-semibold text-slate-800 truncate" th:text="${u != null ? u.nombreCompleto() : ''}"></p>
          <p class="text-xs text-gray-400 truncate" th:text="${u != null ? u.email : ''}"></p>
        </div>
        <a th:href="@{/mis-reservas}" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-gray-50"><span data-icon="calendar" data-cls="w-4 h-4"></span>Mis Reservas</a>
        <a th:href="@{/clases}" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-gray-50"><span data-icon="activity" data-cls="w-4 h-4"></span>Clases Deportivas</a>
        <a th:if="${esAdmin}" th:href="@{/admin}" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-primary-700 font-semibold hover:bg-primary-50"><span data-icon="shieldCheck" data-cls="w-4 h-4"></span>Panel de Administración</a>
        <a th:href="@{/logout}" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-red-500 hover:bg-red-50 mt-1 border-t border-gray-50 pt-2.5"><span data-icon="logout" data-cls="w-4 h-4"></span>Cerrar sesión</a>
      </div>
    </div>
  </div>
</header>

<!-- ============ Footer ============ -->
<footer th:fragment="footer" class="border-t border-gray-100 bg-white mt-6">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-gray-400">
    <div class="flex items-center gap-2">
      <span class="w-6 h-6 rounded-[8px] bg-primary-500 grid place-items-center text-white" data-icon="logo" data-cls="w-3.5 h-3.5"></span>
      <span class="font-display font-bold text-slate-600">CourtHub</span>
    </div>
    <p th:text="'© ' + ${#temporals.year(#temporals.createNow())} + ' CourtHub — Proyecto universitario · Marcos de Desarrollo Web · Spring Boot MVC'"></p>
  </div>
</footer>

<!-- ============ Scripts comunes + mensaje flash ============ -->
<th:block th:fragment="scripts">
  <div id="ch-flash" th:if="${toast}" th:text="${toast}" th:attr="data-tipo=${toastTipo != null ? toastTipo : 'success'}" hidden></div>
  <script th:src="@{/js/api.js}"></script>
  <script th:src="@{/js/ui.js}"></script>
</th:block>

</body>
</html>
