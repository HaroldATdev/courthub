<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourtHub — Canchas Disponibles</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2310b981'/%3E%3Crect x='4.5' y='6.5' width='15' height='11' rx='2' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cline x1='12' y1='6.5' x2='12' y2='17.5' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { primary: {50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b'} },
      fontFamily: { display: ['Poppins','ui-sans-serif','system-ui','sans-serif'], sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] }
    } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/icons.js"></script>
  <script>if (!localStorage.getItem('ch_user')) location.replace('index.html');</script>
</head>
<body class="font-sans bg-[#f6f7f7] text-slate-800 min-h-screen flex flex-col">
  <div id="ch-header"></div>

  <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 pb-10">
    <!-- ================= Filtros ================= -->
    <section class="flex flex-col xl:flex-row xl:items-end xl:justify-between gap-5 pt-6 pb-5">
      <div id="pills" class="flex flex-wrap gap-2">
        <button class="pill active" data-tipo="todos" type="button">Todos</button>
        <button class="pill" data-tipo="futbol" type="button">Fútbol</button>
        <button class="pill" data-tipo="tenis" type="button">Tenis</button>
        <button class="pill" data-tipo="squash" type="button">Squash</button>
        <button class="pill" data-tipo="padel" type="button">Pádel</button>
      </div>

      <div class="flex flex-wrap items-end gap-4">
        <div>
          <p class="ch-label-tiny mb-1.5">Ubicación</p>
          <select id="f-ubicacion" class="ch-select">
            <option value="">Santiago, Chile</option>
            <option>Las Condes</option>
            <option>Providencia</option>
            <option>Vitacura</option>
            <option>Lo Barnechea</option>
            <option>La Reina</option>
            <option>Santiago Centro</option>
            <option>Ñuñoa</option>
            <option>Recoleta</option>
            <option>San Joaquín</option>
          </select>
        </div>
        <div>
          <p class="ch-label-tiny mb-1.5">Rango de precio</p>
          <select id="f-precio" class="ch-select">
            <option value="">Todos los precios</option>
            <option value="0-79.99">Menos de S/ 80</option>
            <option value="80-110">S/ 80 — S/ 110</option>
            <option value="110.01-99999">Más de S/ 110</option>
          </select>
        </div>
        <div class="flex items-center gap-2.5 pb-1.5">
          <label class="switch"><input type="checkbox" id="f-hoy" checked><span class="track"></span></label>
          <span class="text-sm font-medium text-slate-600 whitespace-nowrap">Disponible Hoy</span>
        </div>
      </div>
    </section>
    <!-- ================= Título ================= -->
    <section class="flex flex-wrap items-end justify-between gap-2 mt-2">
      <div>
        <h1 class="font-display text-[26px] sm:text-3xl font-bold text-slate-900">Canchas disponibles para hoy</h1>
        <p class="text-sm text-gray-500 mt-1">Reserva de forma inmediata con confirmación instantánea.</p>
      </div>
      <p id="resumen" class="text-sm text-gray-500">Mostrando canchas verificadas</p>
    </section>

    <!-- ================= Grid de canchas ================= -->
    <section id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6"></section>

    <!-- Sin resultados -->
    <section id="vacio" class="hidden text-center py-24">
      <span class="inline-grid place-items-center w-16 h-16 rounded-full bg-primary-50 text-primary-500 mb-4" data-icon="search" data-cls="w-7 h-7"></span>
      <h2 class="font-display font-semibold text-lg text-slate-800">No encontramos canchas</h2>
      <p class="text-sm text-gray-500 mt-1">Prueba con otro deporte, comuna o rango de precio.</p>
    </section>
  </main>

  <div id="ch-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      CH.requireAuth();
      CH.renderHeader('canchas');
      CH.renderFooter();
      CH.hydrateIcons();

      var estado = {
        tipo: 'todos',
        q: new URLSearchParams(location.search).get('q') || '',
        ubicacion: '',
        precio: ''
      };

      /* ---------- Tarjeta de cancha ---------- */
      function cardHTML(c) {
        return '<article class="fade-up group bg-white rounded-2xl border border-gray-100 shadow-[0_1px_3px_rgba(16,24,40,.05)] overflow-hidden hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">' +
          '<div class="relative h-44 overflow-hidden bg-gradient-to-br from-primary-100 via-primary-50 to-emerald-200">' +
            '<img src="' + c.imagen + '" alt="' + c.nombre + '" loading="lazy" onerror="CH.imgFallback(this,\'cancha' + c.id + '\')" class="w-full h-full object-cover group-hover:scale-[1.05] transition-transform duration-500">' +
            '<span class="absolute top-3 left-3 bg-slate-900/70 backdrop-blur-sm text-white text-[11px] font-semibold px-2.5 py-1 rounded-md">' + (CH.Mock.DEPORTES[c.tipo] || c.tipo) + '</span>' +
          '</div>' +
          '<div class="p-5">' +
            '<h3 class="font-display font-semibold text-slate-900 leading-snug">' + c.nombre + '</h3>' +
            '<div class="mt-1.5 flex items-center gap-1.5 text-sm">' +
              '<span class="text-amber-400">' + CH.icon('star', 'w-4 h-4') + '</span>' +
              '<span class="font-semibold text-slate-700">' + Number(c.calificacion).toFixed(1) + '</span>' +
              '<span class="text-gray-400">(' + c.opiniones + ' opiniones)</span>' +
            '</div>' +
            '<div class="mt-1 flex items-center gap-1.5 text-sm text-gray-500">' + CH.icon('pin', 'w-4 h-4 text-gray-400') + '<span>' + c.comuna + ', Santiago</span></div>' +
            '<div class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between">' +
              '<div><p class="ch-label-tiny">Precio hora</p><p class="font-display font-bold text-lg text-slate-900">' + CH.fmtPEN(c.precioHora) + '</p></div>' +
              '<a href="cancha-detalle.html?id=' + c.id + '" class="btn-primary !px-4 !py-2 !text-[13px]">Reservar ' + CH.icon('arrowRight', 'w-4 h-4') + '</a>' +
            '</div>' +
          '</div>' +
        '</article>';
      }

      /* ---------- Render con filtros ---------- */
      function aplicar() {
        var qs = new URLSearchParams();
        if (estado.tipo !== 'todos') qs.set('tipo', estado.tipo);
        if (estado.q) qs.set('q', estado.q);
        CH.api.get('/canchas' + (qs.toString() ? '?' + qs.toString() : '')).then(function (res) {
          var lista = res.canchas || [];
          if (estado.ubicacion) lista = lista.filter(function (c) { return c.comuna === estado.ubicacion; });
          if (estado.precio) {
            var p = estado.precio.split('-');
            lista = lista.filter(function (c) { return c.precioHora >= +p[0] && c.precioHora <= +p[1]; });
          }
          document.getElementById('grid').innerHTML = lista.map(cardHTML).join('');
          document.getElementById('resumen').textContent = 'Mostrando ' + lista.length + ' cancha' + (lista.length === 1 ? '' : 's') + ' verificada' + (lista.length === 1 ? '' : 's');
          document.getElementById('vacio').classList.toggle('hidden', lista.length > 0);
        }).catch(function (err) { CH.toast(err.message, 'error'); });
      }

      /* ---------- Eventos de filtros ---------- */
      document.querySelectorAll('#pills .pill').forEach(function (pill) {
        pill.addEventListener('click', function () {
          document.querySelectorAll('#pills .pill').forEach(function (p) { p.classList.remove('active'); });
          pill.classList.add('active');
          estado.tipo = pill.dataset.tipo;
          aplicar();
        });
      });
      document.getElementById('f-ubicacion').addEventListener('change', function () { estado.ubicacion = this.value; aplicar(); });
      document.getElementById('f-precio').addEventListener('change', function () { estado.precio = this.value; aplicar(); });
      document.getElementById('f-hoy').addEventListener('change', function () {
        CH.toast(this.checked ? 'Mostrando solo canchas disponibles para hoy.' : 'Mostrando todas las canchas.', 'info');
      });

      aplicar();
    })();
  </script>
</body>
</html>
