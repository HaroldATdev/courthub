# ============================================================
# CourtHub · nginx.conf — Sitio estático + proxy inverso de /api
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---------- Proxy inverso hacia el backend (Node/Express) ----------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Sitio estático (multipágina) ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache largo para assets inmutables (si se agregan hashes)
    location ~* \.(css|js|svg|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
