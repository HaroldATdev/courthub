# ============================================================
# CourtHub · docker-compose.yml
# Levanta Base de Datos (PostgreSQL) + Aplicación Spring Boot MVC
# (vistas Thymeleaf + API REST en un solo servicio), con volumen persistente.
#
#   Uso:  docker compose up --build
#   Web:  http://localhost:8080          ·   API: http://localhost:8080/api/health
#   Admin (ERP): http://localhost:8080/admin  (admin@courthub.com / Password123)
# ============================================================
services:

  # ---------------- Base de datos ----------------
  db:
    image: postgres:16-alpine
    container_name: courthub-db
    environment:
      POSTGRES_USER: courthub
      POSTGRES_PASSWORD: courthub
      POSTGRES_DB: courthub
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # acceso opcional desde el host (pgAdmin, DBeaver…)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courthub -d courthub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------- Aplicación (Spring Boot MVC) ----------------
  # Al arrancar ejecuta db/schema.sql (idempotente) y, si la BD está vacía, db/seed.sql
  app:
    build: ./backend
    container_name: courthub-app
    environment:
      PORT: 8080
      PGHOST: db
      PGPORT: 5432
      PGUSER: courthub
      PGPASSWORD: courthub
      PGDATABASE: courthub
      JWT_SECRET: cambia-esta-clave-en-produccion
      SEED_DEMO: "true"
      TZ: America/Lima
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:   # datos persistentes de PostgreSQL
